# typos spell-checker configuration
# https://github.com/crate-ci/typos

[default.extend-words]
# ratatui is a Rust TUI framework, not a misspelling of "ratatouille"
ratatui = "ratatui"

[files]
extend-exclude = [
    "*.py",
    "**/*.py"
]

# French translations of the daemon panel: not English, not spell-checked.
# A file type (not files.extend-exclude) so it also applies when hk passes the file explicitly.
[type.daemon-i18n]
extend-glob = ["i18n.svelte.js"]
check-file = false
